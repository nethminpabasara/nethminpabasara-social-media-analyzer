<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gromic Digital - Social Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen p-6 font-sans bg-gradient-to-br from-gray-950 via-gray-900 to-emerald-950">
  <div class="max-w-4xl mx-auto space-y-6 mt-10">
    
    <!-- Branding Header -->
    <h1 class="text-3xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 to-emerald-600 mb-8 text-center uppercase tracking-widest">
      Gromic Digital Analyzer
    </h1>

    <!-- Search Bar -->
    <div class="flex gap-3 bg-gray-900/80 p-4 rounded-xl border border-emerald-900/50 shadow-2xl shadow-emerald-900/20 backdrop-blur-sm">
      <input id="handleInput" type="text" placeholder="Enter IG handle (e.g. nike)" class="bg-gray-950 text-white px-4 py-3 rounded-lg flex-1 outline-none border border-gray-800 focus:border-emerald-500 transition-colors">
      <button onclick="fetchReport()" class="bg-gradient-to-r from-emerald-500 to-emerald-600 hover:from-emerald-400 hover:to-emerald-500 text-black font-bold px-8 py-3 rounded-lg shadow-lg shadow-emerald-500/30 transition-all uppercase tracking-wide">
        Analyze
      </button>
    </div>

    <!-- Main Score Grid -->
    <div id="reportContainer" class="hidden space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Scorecard -->
        <div class="bg-gray-900/80 p-6 rounded-xl border border-emerald-900/30 shadow-xl flex flex-col items-center backdrop-blur-sm">
          <h2 class="text-xl font-bold text-emerald-400 mb-4 tracking-wide">Overall Rating</h2>
          <div id="overallScore" class="text-7xl font-extrabold text-transparent bg-clip-text bg-gradient-to-b from-white to-gray-400 mb-6 drop-shadow-md">0</div>
          <div class="w-full h-64">
            <canvas id="scoreChart"></canvas>
          </div>
        </div>

        <!-- Strategy Box -->
        <div class="bg-gray-900/80 p-6 rounded-xl border border-emerald-900/30 shadow-xl space-y-4 backdrop-blur-sm flex flex-col justify-center">
          <h2 class="text-xl font-bold text-emerald-400 tracking-wide">AI Strategic Insights</h2>
          
          <div class="bg-red-950/30 border border-red-900/50 p-5 rounded-lg">
            <h3 class="text-red-400 font-bold text-xs uppercase tracking-wider mb-2">Core Weakness</h3>
            <p id="mainProblem" class="text-gray-300 text-sm leading-relaxed"></p>
          </div>
          
          <div class="bg-emerald-950/30 border border-emerald-900/50 p-5 rounded-lg">
            <h3 class="text-emerald-400 font-bold text-xs uppercase tracking-wider mb-2">Priority Execution</h3>
            <p id="priorityFix" class="text-gray-300 text-sm leading-relaxed"></p>
          </div>
        </div>

      </div>

      <!-- Content Ideas -->
      <div class="bg-gray-900/80 p-6 rounded-xl border border-emerald-900/30 shadow-xl backdrop-blur-sm">
        <h2 class="text-xl font-bold text-emerald-400 mb-6 tracking-wide">Content Roadmap</h2>
        <ul id="ideasList" class="space-y-3 text-gray-300 text-sm"></ul>
      </div>
    </div>

  </div>

  <script>
    // 1. DO NOT CHANGE THIS URL (It matches your Supabase screenshot)
    const SUPABASE_URL = 'https://zoaivzesljcskmktyahx.supabase.co';
    
    // 2. PASTE YOUR PUBLISHABLE KEY HERE
    const SUPABASE_ANON_KEY = 'sb_publishable_y9pfXRWDGiq4Q6EacSRd8w_sIsvP8CR'; 
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    let chartInstance = null;

    async function fetchReport() {
      const handle = document.getElementById('handleInput').value.trim();
      if (!handle) return;

      // Update button text while loading
      const btn = document.querySelector('button');
      const originalText = btn.innerText;
      btn.innerText = "Loading...";

      let data, error;
      try {
        ({ data, error } = await supabaseClient
          .from('reports')
          .select('*')
          .eq('social_handle', handle)
          .order('created_at', { ascending: false })
          .limit(1));
      } catch (err) {
        btn.innerText = originalText;
        alert('Could not reach the database. Check your connection and try again.');
        return;
      }

      btn.innerText = originalText;

      if (error || !data || !data.length) {
        alert('No report found for @' + handle + '. Make sure you scraped it with the extension first!');
        return;
      }

      const report = data[0];
      const ai = report.ai_analysis || {};

      document.getElementById('reportContainer').classList.remove('hidden');
      document.getElementById('overallScore').innerText = report.overall_score ?? '—';
      document.getElementById('mainProblem').innerText = ai.main_problem || 'No data available.';
      document.getElementById('priorityFix').innerText = ai.priority_fix || 'No data available.';

      const listEl = document.getElementById('ideasList');
      const ideas = Array.isArray(ai.content_ideas) ? ai.content_ideas : [];
      listEl.innerHTML = ideas.map(i => `
        <li class="p-4 bg-gray-950/50 border border-gray-800 rounded-lg flex items-start gap-3">
          <span class="text-emerald-500 mt-0.5">✦</span>
          <span>${i}</span>
        </li>
      `).join('');

      renderChart([
        report.content_score ?? 0,
        report.profile_score ?? 0,
        report.engagement_score ?? 0,
        report.branding_score ?? 0,
        report.strategy_score ?? 0
      ]);
    }

    function renderChart(scores) {
      const ctx = document.getElementById('scoreChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['Content', 'Profile', 'Engagement', 'Branding', 'Strategy'],
          datasets: [{
            data: scores,
            backgroundColor: 'rgba(16, 185, 129, 0.15)',
            borderColor: '#10B981',
            pointBackgroundColor: '#10B981',
            pointBorderColor: '#fff',
            borderWidth: 2,
          }]
        },
        options: {
          plugins: { legend: { display: false } },
          scales: { 
            r: { 
              min: 0, 
              max: 100, 
              ticks: { display: false }, 
              grid: { color: 'rgba(55, 65, 81, 0.5)' },
              pointLabels: { color: '#9CA3AF', font: { size: 12, family: 'sans-serif' } },
              angleLines: { color: 'rgba(55, 65, 81, 0.5)' }
            } 
          }
        }
      });
    }
  </script>
</body>
</html>
